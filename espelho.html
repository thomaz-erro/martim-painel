<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Martim — Painel de disponibilidade v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* medidas do frame "Painel de disponibilidade — v3" (Figma 104:1094), 1600 × 952 */
  :root{
    --paper:#FCEFD9; --ink:#1B1D1B; --muted:#5B564C;
    --line:rgba(27,29,27,.15); --res:#9B7BA6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden;font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .frame{width:1600px;height:952px;flex:none;background:var(--paper);color:var(--ink);position:relative;transform-origin:center center}

  /* cabeçalho */
  .header{position:absolute;top:0;left:0;width:1600px;height:210px;background:var(--ink);color:var(--paper)}
  .title{position:absolute;left:64px;top:45px;width:332px}
  .title svg{width:332px;height:77px;display:block}
  .updated{margin-top:32px;font-size:17px;font-weight:400;font-style:italic;line-height:1}
  .logo{position:absolute;left:633px;top:45px;width:333px}
  .logo svg{width:333px;height:123px;display:block}
  .stat{position:absolute;right:64px;top:45px;width:246px;text-align:right;display:flex;flex-direction:column;gap:2px}
  .stat .pct{font-size:80px;font-weight:800;line-height:97px;white-space:nowrap}
  .stat .label{font-size:14px;font-weight:700;letter-spacing:1.2px;line-height:17px}
  .stat .sub{font-size:14px;font-weight:400;line-height:17px}

  /* quadro: x 64→1537, y 244→883 */
  .table{position:absolute;left:64px;top:244px;width:1473px;min-height:639px;display:grid;
    grid-template-columns:177px repeat(4,324px);
    grid-template-rows:72px minmax(min-content,203fr) minmax(min-content,203fr) minmax(min-content,161fr)}
  .cell{display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
  .cell.col{border-left:1px solid var(--line)}
  .cell.col.c4{border-right:1px solid var(--line)}
  .cell.last{border-bottom:none}

  .colhead{gap:15px;padding:18px 0}
  .colhead .chip{width:16px;height:32px;flex:none}
  .colhead .txt{display:flex;flex-direction:column;font-size:15px;line-height:18px;white-space:nowrap}
  .colhead .txt b{font-weight:700;white-space:pre}
  .colhead .txt span{font-weight:400}
  .colhead .pctven{display:flex;flex-direction:column;font-size:13px;font-weight:500;line-height:16px;color:var(--muted);white-space:nowrap}

  .rowlabel{justify-content:flex-start;padding-left:9px}
  .rowlabel div{font-size:18px;line-height:22px}
  .rowlabel b{display:block;font-weight:600}
  .rowlabel i{display:block;font-weight:300;font-style:italic}

  .tilecell{padding:20px 0}
  .tiles{width:233px;display:flex;flex-wrap:wrap;gap:11px;justify-content:flex-start;align-content:center}
  .u{width:50px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

  .legend{position:absolute;right:64px;top:895px;display:flex;align-items:center;gap:10.5px;font-size:17px;font-weight:500;line-height:21px}
  .legend i{width:20px;height:20px;background:var(--res);display:block}

  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--paper);font-size:15px;color:var(--ink);text-align:center;padding:40px}
  #drop.on{display:flex}
  #err{font-size:12px;color:#EC713D;max-width:520px}
</style>
</head>

const norm = v => String(v||'').trim().toLowerCase();

// colunas do quadro (Figma v3)
const PRODUTOS = [
  { finais:[3],   titulo:'Final 03  ·  70m²',        nome:'Esquina Galeria',          cor:'#284A9B', texto:'#FCEFD9' },
  { finais:[4],   titulo:'Final 04  ·  84m²',        nome:'Esquina Cassiano',         cor:'#437BFF', texto:'#FCEFD9' },
  { finais:[5,6], titulo:'Finais 05 e 06  ·  63m²',  nome:'Meio frente R. Acalmada',  cor:'#5BC2D8', texto:'#1B1D1B' },
  { finais:[9],   titulo:'Final 09  ·  77m²',        nome:'Meio',                     cor:'#9CEEFF', texto:'#1B1D1B' },
];
// linhas do quadro, de cima para baixo
const FAIXAS = [
  { nome:'Andares altos',  sub:'20º ao 27º', min:20, max:27 },
  { nome:'Andares médios', sub:'9º ao 19º',  min:9,  max:19 },
  { nome:'Andares baixos', sub:'2º ao 8º',   min:2,  max:8  },
];
const COR_RESERVADA = '#9B7BA6', TEXTO_RESERVADA = '#1B1D1B';

/* ============ LEITURA DA ABA DADOS (igual ao painel.html) ============ */
function lerPlanilha(buf){
  let grid;
  if (Array.isArray(buf)) grid = buf;
  else {
    const wb = XLSX.read(buf, {type:'array', raw:true});
    const ws = wb.Sheets['DADOS'] || wb.Sheets[wb.SheetNames[0]]; if (!ws) throw new Error('Não encontrei a aba DADOS.');
    grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  }
  const acharCab = (rotulo) => { for (let r=0; r<grid.length; r++){ const row=grid[r]||[]; const c0=row.findIndex(v=>norm(v)==='andar');
      if (c0>=0 && row.some(v=>norm(v)===rotulo)) return {r, c0}; } return null; };
  const hs = acharCab('status'), ht = acharCab('tipologia');
  if (!hs || !ht){
    const amostra = grid.slice(0,6).map(r=>(r||[]).slice(0,4).map(v=>String(v==null?'':v)).join(' | ')).join(' // ');
    throw new Error('Não encontrei os blocos "Status" e "Tipologia" na aba DADOS. Primeiras linhas recebidas: '+amostra);
  }
  const lerBloco = (h) => { const out=[]; for (let r=h.r+1; r<grid.length; r++){ const row=grid[r]; if(!row || norm(row[h.c0])==='') break;
      const andar=parseInt(String(row[h.c0])); if (isNaN(andar)) break; const salas=[];
      for(let c=h.c0+1;c<row.length;c+=2){ if(row[c]==null||row[c]===''||isNaN(Number(row[c]))) continue; salas.push({n:row[c], v:row[c+1]}); }
      out.push({andar, salas}); } return out; };
  const st = lerBloco(hs);
  return st.map(f => ({ andar: f.andar, salas: f.salas.map(s => ({ n:Number(s.n), status:norm(s.v) })) }));
}

/* ============ RENDER ============ */
function render(andares, quando){
  const flat = [];
  andares.forEach(f => f.salas.forEach(s => flat.push({andar:f.andar, n:s.n, status:s.status})));
  const lista = arr => arr.map(norm);
  const isDis = st => lista(CONFIG.statusDisponivel).includes(st);
  const isBlo = st => lista(CONFIG.statusBloqueada).includes(st);
  const isRes = st => lista(CONFIG.statusReservada).includes(st);
  const vendida = st => !isDis(st) && !isRes(st) && !isBlo(st);

  // total do prédio (andar corporativo/bloqueado fica fora da conta)
  const contaveis = flat.filter(s => !isBlo(s.status));
  const vendidas = contaveis.filter(s => vendida(s.status)).length;

  const cells = [`<div class="cell rowlabel"></div>`];
  PRODUTOS.forEach((p, i) => {
    const doProduto = contaveis.filter(s => p.finais.includes(s.n % 100));
    const v = doProduto.filter(s => vendida(s.status)).length;
    const pct = doProduto.length ? Math.round(v / doProduto.length * 100) : 0;
    cells.push(`<div class="cell col colhead c${i+1}">
      <span class="chip" style="background:${p.cor}"></span>
      <span class="txt"><b>${p.titulo}</b><span>${p.nome}</span></span>
      <span class="pctven"><span>${pct}%</span><span>vendido</span></span>
    </div>`);
  });

  FAIXAS.forEach((fx, fi) => {
    const last = fi === FAIXAS.length - 1 ? ' last' : '';
    cells.push(`<div class="cell rowlabel${last}"><div><b>${fx.nome}</b><i>${fx.sub}</i></div></div>`);
    PRODUTOS.forEach((p, i) => {
      // vendidas e bloqueadas saem do quadro; livres e reservadas ficam
      const itens = flat
        .filter(s => p.finais.includes(s.n % 100) && s.andar >= fx.min && s.andar <= fx.max && (isDis(s.status) || isRes(s.status)))
        .sort((a, b) => a.n - b.n);
      const tiles = itens.map(s => {
        const r = isRes(s.status);
        return `<div class="u" style="background:${r ? COR_RESERVADA : p.cor};color:${r ? TEXTO_RESERVADA : p.texto}">${s.n}</div>`;
      }).join('');
      cells.push(`<div class="cell col tilecell c${i+1}${last}"><div class="tiles">${tiles}</div></div>`);
    });
  });

  document.getElementById('table').innerHTML = cells.join('');
  const pctGeral = contaveis.length ? Math.round(vendidas / contaveis.length * 1000) / 10 : 0;
  document.getElementById('statPct').textContent = pctGeral.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) + '%';
  document.getElementById('statSub').textContent = vendidas + ' de ' + contaveis.length + ' salas';
  const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('updated').textContent = 'Atualizado em ' + quando.getDate() + ' ' + meses[quando.getMonth()] + ' ' + quando.getFullYear();
  document.getElementById('drop').classList.remove('on');
  ajustar();
}

/* ============ CARREGAMENTO ============ */
let assinaturaAnterior = null;
async function carregarDaPasta(){
  try{
    const sep = CONFIG.arquivo.includes('?') ? '&' : '?';
    const r = await fetch(CONFIG.arquivo+sep+'t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const ct = r.headers.get('content-type')||'';
    let dados, quando, assinatura;
    if (ct.includes('json')){
      const j = await r.json();
      dados = j.dados || j.values; quando = j.atualizado ? new Date(j.atualizado) : new Date(); assinatura = JSON.stringify(dados);
    } else {
      const buf = await r.arrayBuffer();
      const mod = r.headers.get('last-modified'); quando = mod ? new Date(mod) : new Date();
      dados = buf; assinatura = buf.byteLength+'|'+mod;
    }
    if (assinatura!==assinaturaAnterior){ render(lerPlanilha(dados), quando); assinaturaAnterior=assinatura; }
  }catch(e){
    if(!assinaturaAnterior){ document.getElementById('drop').classList.add('on');
      document.getElementById('err').textContent = 'Não consegui ler '+CONFIG.arquivo+' ('+e.message+').'; }
  }
}

/* ============ ESCALA PARA A TELA ============ */
function ajustar(){
  const fr = document.getElementById('frame');
  // se alguma faixa precisar de mais altura que o desenho, a legenda e o quadro descem juntos
  const tb = document.getElementById('table'), lg = document.querySelector('.legend');
  const topoLegenda = Math.max(895, 244 + tb.offsetHeight + 12);
  lg.style.top = topoLegenda + 'px';
  const h = Math.max(952, topoLegenda + 21 + 36);
  fr.style.height = h + 'px';
  const s = Math.min(innerWidth / 1600, innerHeight / h);
  fr.style.transform = `scale(${s})`;
}
addEventListener('resize', ajustar); ajustar();
carregarDaPasta(); setInterval(carregarDaPasta, Math.max(1, CONFIG.recarregarCadaSeg) * 1000);
</script>
