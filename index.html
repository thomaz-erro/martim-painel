<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Martim — Painel de disponibilidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --line:#C9CCC6; --amen:#DFE1DC; --amen-text:#1B1D1B; --ink:#1B1D1B;
    --t7088:#284A9B; --t4863:#5BC2D8; --t3941:#EC713D;  /* tipologias (book pág. 74) */
    --res:#F3DA5E;                                        /* sala reservada */
  }
  .frame[data-tema="black"]{ --paper:#1B1D1B; --text:#FCEFD9; --stroke:#FCEFD9; }
  .frame[data-tema="off"]{   --paper:#FCEFD9; --text:#1B1D1B; --stroke:#1B1D1B; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1B1D1B;font-family:"Articulat CF","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .frame{width:1500px;height:1000px;background:var(--paper);color:var(--text);transform-origin:center center;position:relative}

  /* torre: ocupa o quadro inteiro, centralizada na vertical */
  .main{position:absolute;inset:0;padding:20px 40px 20px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px}
  .floors{display:flex;flex-direction:column;gap:4px}
  .floor{display:grid;grid-template-columns:40px 1fr;column-gap:16px;align-items:center}
  .fl{font-size:11px;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .units{display:flex;gap:14px}
  .u{width:81px;height:31px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;box-shadow:inset 0 0 0 1.5px var(--stroke)}
  .u b{font-size:12px;font-weight:800;line-height:13px}
  /* traçado creme de 1px por fora das letras (como no Figma): stroke de 2px pintado atrás do preenchimento */
  .u:not(.res) b,.u:not(.res) small{paint-order:stroke fill;-webkit-text-stroke:2px #FCEFD9;text-stroke:2px #FCEFD9}
  .u small{font-size:8.5px;font-weight:700;line-height:10px;opacity:.85}
  .u.A{background:var(--t3941)} .u.C{background:var(--t4863)} .u.B{background:var(--t7088)}
  .u.res{background:var(--res);color:rgba(27,29,27,.5)}
  .amen{height:31px;flex:none;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--amen-text);background:var(--amen)}
  .vistas{display:grid;grid-template-columns:40px 1fr;column-gap:16px}
  .vistas .units{align-items:flex-end}
  .v{width:81px;flex:none;font-size:10px;font-weight:600;line-height:1.2;color:var(--text);text-align:center}
  .vsub{position:relative;width:81px;height:31px;flex:none}
  .vsub .v{position:absolute;left:0;bottom:0}

  /* coluna lateral: à direita, sobre o espaço livre da torre */
  .side{position:absolute;left:1057px;top:86px;width:343px;padding:0 11px;display:flex;flex-direction:column;color:var(--text)}
  .title{width:321px;height:74px;color:var(--text)}
  .title svg{width:100%;height:100%;display:block}
  .updated{margin-top:21px;font-size:12px;font-style:italic;color:var(--text)}
  .logo{margin-top:71px;width:321px;height:118px}
  .logo svg{width:100%;height:100%;display:block;color:var(--text)}
  .legend{margin-top:71px;display:flex;flex-direction:column;gap:13px;font-size:17px;font-weight:500}
  .legend h3{font-size:15.7px;font-weight:600}
  .legend span{display:flex;align-items:center;gap:10.5px}
  .legend i{width:21px;height:21px;flex:none;display:inline-block}
  #tema{margin-top:40px;display:flex;gap:4px;font-size:11px;opacity:.45;transition:opacity .2s;align-self:flex-start}
  #tema:hover{opacity:1}
  #tema button{font:inherit;color:var(--text);background:none;border:1px solid var(--text);padding:3px 9px;cursor:pointer;letter-spacing:.04em}
  #tema button[aria-pressed="true"]{background:var(--text);color:var(--paper)}

  /* modo LED (config.js: modoLed: true) */
  .led .u b{font-size:13.5px;line-height:14px}
  .led .u:not(.res) b,.led .u:not(.res) small{-webkit-text-stroke-width:2.5px}
  .led .u small{font-size:10px;line-height:11px;opacity:1}
  .led .u{box-shadow:inset 0 0 0 2px var(--stroke)}
  .led .v{font-size:11px}
  .led .fl{font-size:12px}
  .led .amen{font-size:12px}

  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--paper);font-size:15px;color:var(--text);text-align:center;padding:40px}
  #drop.on{display:flex}
  #drop label{border:1.5px dashed var(--text);padding:12px 18px;cursor:pointer;color:var(--text)}
  #drop input{display:none}
  #err{font-size:12px;color:#EC713D;max-width:520px}
</style>
</head>

      <span><i style="background:var(--t4863)"></i>Salas de 48 a 63 m²</span>
      <span><i style="background:var(--t3941)"></i>Salas de 39 a 41 m²</span>
      <span><i style="background:var(--res)"></i>Sala Reservada</span>
      <span><i style="background:var(--amen)"></i>Área condominial</span>
    </div>
    <div id="tema" role="group" aria-label="Cor do painel">
      <button type="button" data-escolha="black">Black</button>
      <button type="button" data-escolha="off">Off</button>
    </div>
  </aside>
  <div id="drop">
    <div>Nenhuma planilha carregada.</div>
    <label>Escolher Martim_espelho.xlsx<input type="file" id="file" accept=".xlsx"></label>
    <div>ou arraste o arquivo para esta janela</div>
    <div id="err"></div>
  </div>
</div>
</div>

<script src="config.js"></script>
<script>
/* ============ CONFIGURAÇÃO ============
   Os valores abaixo são os padrões. Tudo que estiver em config.js (mesma pasta) sobrescreve estes,
   então ao atualizar este arquivo o config.js continua valendo. */
const CONFIG_PADRAO = {
  // FONTE DOS DADOS — use uma das três:
  // (a) Google Sheets em tempo real, via Apps Script (recomendado — veja google-apps-script.gs):
  //     cole aqui a URL do app da web, que termina em /exec
  // (b) aba DADOS publicada como CSV (Arquivo > Compartilhar > Publicar na web) — demora até ~5 min para refletir edições
  // (c) planilha .xlsx na mesma pasta do painel.html
  arquivo: 'https://script.google.com/macros/s/AKfycbw1tM-C-xwrXolul-5A4lsgk3DlS4qdavubNF_ruRitz9SrjCQh-PF3Ke2kftTBwHqE/exec',
  // arquivo: 'Martim_espelho.xlsx',   // alternativa: planilha .xlsx na mesma pasta
  recarregarCadaSeg: 15,            // relê a fonte a cada N segundos
  // status da planilha que aparecem como "Disponível"; todos os outros aparecem como "Reservada"
  statusDisponivel: ['livre'],
  // blocos de áreas comuns: em qual andar, quantas salas de largura, e se vêm antes ou depois das salas
  areasComuns: { 7: {span: 6, pos: 'depois'}, 2: {span: 4, pos: 'antes'} },
};
// vista de cada posição (final), conforme nomenclatura definida pela ERRO/Idealiza
const VISTAS_PADRAO = {
  1:'Galeria', 2:'Galeria', 3:'Galeria/The One', 4:'The One/Cassiano', 5:'Cassiano', 6:'Cassiano',
  7:'Cassiano', 8:'Cassiano', 9:'Cassiano/R. Acalmada', 10:'R. Acalmada/Parque',
  11:'Rua Acalmada', 12:'Acalmada/Parque', 13:'Parque/Galeria', 14:'Galeria'
};
const CFG = window.MARTIM_CONFIG || {};
const CONFIG = Object.assign({}, CONFIG_PADRAO, CFG);
const VISTAS = Object.assign({}, VISTAS_PADRAO, CFG.vistas || {});
const AREAS_COMUNS_NOMES = Object.assign({7:'Gourmet, Mirador Gourmet e Salas de reunião', 2:'Lounge, Salas Multiuso e Praça Cererê'}, CFG.areasComunsNomes || {});
// fontes do projeto informadas no config.js
(CFG.fontes||[]).forEach(f=>{ const st=document.createElement('style'); st.textContent=`@font-face{font-family:"Articulat CF";src:url("${f.arquivo}");font-weight:${f.peso||400}}`; document.head.appendChild(st); });
// área privativa de cada sala (book pág. 74). Chave: número da sala. Pode ser sobrescrita em config.js (areas: {...})
const AREAS_PADRAO = (()=>{
  const A27=['39,29','55,11','70,27','87,75','63,81','63,95','41,11','41,11','77,80','74,74'];
  const A826=['39,46','55,11','70,41','84,84','63,81','63,88','41,04','41,04','77,68','74,85'];
  const A36=['39,46','55,11','70,41','84,84','63,81','63,88','41,04','41,04','86,38','63,73','63,80','70,16','59,24','48,78'];
  const A2=['88,59','41,04','41,04','86,38','63,73','63,80','70,16','85,10','81,54'];
  const m={};
  A27.forEach((a,i)=>m[2700+i+1]=a);
  for(let f=26;f>=8;f--) A826.forEach((a,i)=>m[f*100+i+1]=a);
  A826.slice(0,8).forEach((a,i)=>m[700+i+1]=a);
  for(let f=6;f>=3;f--) A36.forEach((a,i)=>m[f*100+i+1]=a);
  A2.forEach((a,i)=>m[200+i+1]=a);
  return m;
})();
const AREAS = Object.assign({}, AREAS_PADRAO, CFG.areas || {});
const TIPO_CLASS = { '70 a 88 m²':'B', '48 a 63 m²':'C', '39 a 41 m²':'A' };
const TIPO_ORDER = ['70 a 88 m²','48 a 63 m²','39 a 41 m²'];
const TIPO_VAR   = { '70 a 88 m²':'--t7088', '48 a 63 m²':'--t4863', '39 a 41 m²':'--t3941' };

/* ============ LEITURA DA ABA DADOS ============ */
function lerPlanilha(buf){
  let grid;
  if (Array.isArray(buf)) grid = buf;                       // já veio como grade (JSON do Apps Script)
  else {
    const wb = XLSX.read(buf, {type:'array', raw:true});
    const ws = wb.Sheets['DADOS'] || wb.Sheets[wb.SheetNames[0]]; if (!ws) throw new Error('Não encontrei a aba DADOS.');
    grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  }
  // localiza os dois blocos pelo cabeçalho "Andar" + ("Status" | "Tipologia")
  const achar = (col2) => grid.findIndex(r => r && String(r[0]).trim()==='Andar' && String(r[2]).trim()===col2);
  const hs = achar('Status'), ht = achar('Tipologia');
  if (hs<0 || ht<0) throw new Error('Não encontrei os blocos "Status" e "Tipologia" na aba DADOS.');
  const lerBloco = (h) => { const out=[]; for (let r=h+1; r<grid.length; r++){ const row=grid[r]; if(!row || !row[0]) break;
      const andar=parseInt(String(row[0])); const salas=[]; for(let c=1;c<row.length;c+=2){ if(row[c]==null||row[c]===''||isNaN(Number(row[c]))) continue; salas.push({n:row[c], v:row[c+1]}); }
      out.push({andar, salas, obs: row[row.length-1]}); } return out; };
  const st = lerBloco(hs), tp = lerBloco(ht);
  const tipoPorSala = {}; tp.forEach(f => f.salas.forEach(s => tipoPorSala[String(s.n)] = s.v));
  return st.map(f => ({ andar: f.andar, salas: f.salas.map(s => ({ n:String(s.n), status:String(s.v||'').trim().toLowerCase(), tipo: tipoPorSala[String(s.n)] })) }));
}

/* ============ RENDER ============ */
function render(andares, quando){
  const cnt={dis:0,res:0}; const tipoCnt={}; TIPO_ORDER.forEach(t=>tipoCnt[t]={t:0,r:0});
  const el = document.getElementById('floors'); el.innerHTML='';
  const fmtVista = v => v.replace(/^Esq(uina|\.) /,'').replace('/',' /<br>');
  const vistaRow = (finais) => `<div></div><div class="units">${finais.map(i=> i==null ? '<div class="v"></div>' : `<div class="v">${fmtVista(VISTAS[i]||'')}</div>`).join('')}</div>`;
  const maxTop = andares[0].salas.length;                       // colunas do andar mais alto
  const maxAll = Math.max(...andares.map(f=>f.salas.length));   // colunas do andar mais largo
  document.getElementById('vistas').innerHTML = vistaRow(Array.from({length:maxTop},(_,i)=>i+1));
  // vistas das colunas extras (torre mais larga embaixo): vão no andar mais próximo, acima do primeiro andar
  // largo, que ainda tenha aquelas colunas vazias (sem sala nem área comum)
  const larguraOcupada = f => f.salas.length + (CONFIG.areasComuns[f.andar] ? CONFIG.areasComuns[f.andar].span : 0);
  const idxLargo = andares.findIndex(f=>f.salas.length>maxTop);
  let idxSub = -1;
  if (idxLargo>0){ for (let k=idxLargo-1; k>=0; k--){ if (larguraOcupada(andares[k])<=maxTop){ idxSub=k; break; } } }
  andares.forEach((f,k)=>{
    const row=document.createElement('div'); row.className='floor';
    row.innerHTML=`<div class="fl">${f.andar}º</div>`;
    const units=document.createElement('div'); units.className='units';
    const ac = CONFIG.areasComuns[f.andar];
    const amen = ac ? `<div class="amen" style="width:${ac.span*81+(ac.span-1)*14}px">${amenLabel(f.andar)}</div>` : '';
    const tiles = f.salas.map(s=>{
      const dis = CONFIG.statusDisponivel.includes(s.status); cnt[dis?'dis':'res']++;
      if (tipoCnt[s.tipo]){ tipoCnt[s.tipo].t++; if(!dis) tipoCnt[s.tipo].r++; }
      const area = s.area || AREAS[s.n] || '';
      return `<div class="u ${TIPO_CLASS[s.tipo]||''} ${dis?'dis':'res'}"><b>${s.n}</b><small>${area ? area+' m²' : ''}</small></div>`;
    }).join('');
    let extra='';
    if (k===idxSub){ const larga=andares[idxLargo]; extra = Array.from({length:larga.salas.length-maxTop},(_,i)=>`<div class="vsub"><div class="v">${fmtVista(VISTAS[maxTop+i+1]||'')}</div></div>`).join(''); }
    units.innerHTML = (ac && ac.pos==='antes' ? amen+tiles : tiles+amen) + extra;
    row.appendChild(units); el.appendChild(row);
  });
  document.getElementById('updated').textContent='Atualizado em '+quando.toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'}).replace('.','').replace(/ de /g,' ')+', '+quando.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('drop').classList.remove('on');
}
function amenLabel(andar){ return AREAS_COMUNS_NOMES[andar]||'Área condominial'; }

/* ============ CARREGAMENTO ============ */
let assinaturaAnterior = null;
async function carregarDaPasta(){
  try{
    const r = await fetch(CONFIG.arquivo+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const ct = r.headers.get('content-type')||'';
    let dados, quando, assinatura;
    if (ct.includes('json')){
      const j = await r.json();                                // {atualizado, dados:[[...],[...]]}
      dados = j.dados; quando = j.atualizado ? new Date(j.atualizado) : new Date(); assinatura = JSON.stringify(j.dados);
    } else {
      const buf = await r.arrayBuffer();
      const mod = r.headers.get('last-modified'); quando = mod ? new Date(mod) : new Date();
      dados = buf; assinatura = buf.byteLength+'|'+mod;
    }
    if (assinatura!==assinaturaAnterior){ render(lerPlanilha(dados), quando); assinaturaAnterior=assinatura; }
  }catch(e){
    if(!assinaturaAnterior){ document.getElementById('drop').classList.add('on');
      document.getElementById('err').textContent = location.protocol==='file:' ? 'Aberto direto do disco: o navegador não deixa ler a planilha automaticamente. Use um servidor web ou carregue o arquivo aqui.' : 'Não consegui ler '+CONFIG.arquivo+' ('+e.message+').'; }
  }
}
function carregarArquivo(file){ const fr=new FileReader(); fr.onload=()=>{ try{ render(lerPlanilha(fr.result), new Date(file.lastModified)); assinaturaAnterior='manual'; }catch(e){ document.getElementById('err').textContent=e.message; } }; fr.readAsArrayBuffer(file); }
document.getElementById('file').addEventListener('change', e=>{ if(e.target.files[0]) carregarArquivo(e.target.files[0]); });
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) carregarArquivo(f); });

/* ============ ESCALA PARA A TELA ============ */
if (CFG.modoLed) document.getElementById('frame').classList.add('led');
/* tema: ordem de prioridade — escolha feita no botão (salva no navegador) > ?tema= na URL > config.js > black */
function aplicarTema(t, salvar){
  if (t!=='black' && t!=='off') t='black';
  document.getElementById('frame').dataset.tema=t; document.body.style.background = t==='off' ? '#FCEFD9' : '#1B1D1B';
  document.querySelectorAll('#tema button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.escolha===t));
  if (salvar){ try{ localStorage.setItem('martim_tema', t); }catch(e){} }
}
(function(){ let t=null; try{ t=localStorage.getItem('martim_tema'); }catch(e){}
  aplicarTema(t || new URLSearchParams(location.search).get('tema') || CFG.tema || 'black', false); })();
document.querySelectorAll('#tema button').forEach(b=>b.addEventListener('click', ()=>aplicarTema(b.dataset.escolha, true)));
function ajustar(){ const s=Math.min(innerWidth/1500, innerHeight/1000); document.getElementById('frame').style.transform=`scale(${s})`; }
addEventListener('resize', ajustar); ajustar();
carregarDaPasta(); setInterval(carregarDaPasta, CONFIG.recarregarCadaSeg*1000);
</script>
</body>
