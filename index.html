<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Martim — Painel de disponibilidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#FCEFD9;
    --ink:#1B1D1B; --ink-2:#5C605B; --line:#C9CCC6;
    --livre:#3A9A7E; --livre-text:#FCEFD9;
    --res:#F3DA5E;   --res-text:#1B1D1B;
    --amen:#DFE1DC;
    --t7088:#284A9B; --t4863:#5BC2D8; --t3941:#EC713D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);font-family:"Articulat CF","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .frame{width:1500px;height:1000px;background:var(--paper);display:grid;grid-template-columns:360px 1fr;transform-origin:center center;position:relative}

  .side{padding:44px 36px 40px 44px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .title{font-size:15px;color:var(--ink-2)}
  .updated{margin-top:6px;font-size:12px;color:var(--ink-2)}
  .logo{margin-top:56px;width:234px;height:86px}
  .logo svg{width:100%;height:100%}
  .kpi{margin-top:56px}
  .big{font-size:64px;font-weight:800;line-height:.95;letter-spacing:-.03em}
  .big small{font-size:18px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-left:6px}
  .bar{margin-top:38px;height:14px;display:flex;overflow:hidden;background:#fff;border:1px solid var(--line)}
  .bar i{display:block;height:100%}
  .rows{margin-top:14px;font-size:13px}
  .rows div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .rows div:last-child{border-bottom:0}
  .rows span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
  .rows .sw{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px;border:1px solid var(--line)}
  .tipos{margin-top:64px;font-size:13px}
  .tipos h3{font-size:13px;font-weight:600;margin-bottom:8px}
  .tipo{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
  .tipo:last-child{border-bottom:0}
  .tipo b{display:block;height:20px;width:4px}
  .tipo em{font-style:normal;color:var(--ink-2);display:block;font-size:11px;margin-top:1px}
  .tipo .mini{width:72px;height:6px;background:#fff;border:1px solid var(--line)}
  .tipo .mini i{display:block;height:100%;background:var(--res)}

  .main{padding:30px 40px 30px 34px;display:flex;flex-direction:column}
  .floors{display:flex;flex-direction:column;gap:7px}
  .floor{display:grid;grid-template-columns:40px 1fr;column-gap:16px;align-items:center}
  .fl{font-size:11px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
  .units{display:flex;gap:6px}
  .u{width:66px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;position:relative;font-variant-numeric:tabular-nums}
  .u:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px}
  .u.A:before{background:var(--t3941)} .u.C:before{background:var(--t4863)} .u.B:before{background:var(--t7088)}
  .u.dis{background:var(--livre);color:var(--livre-text)}
  .u.res{background:var(--res);color:var(--res-text)}
  .amen{height:26px;flex:none;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--ink-2);background:var(--amen);border:1px dashed var(--line)}
  .vistas{display:grid;grid-template-columns:40px 1fr;column-gap:16px;margin-bottom:8px}
  .vistas .units{align-items:flex-end}
  .v{width:66px;flex:none;font-size:9px;line-height:1.2;color:var(--ink-2);text-align:center;padding-bottom:3px}
  .vistas.sub{margin:0}
  .legend{margin-top:auto;display:flex;gap:22px;font-size:12px;align-items:center;height:22px}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:14px;height:14px;display:inline-block}

  /* estado sem dados */
  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(252,239,217,.96);font-size:15px;color:var(--ink-2);text-align:center;padding:40px}
  #drop.on{display:flex}
  #drop label{border:1.5px dashed var(--ink-2);padding:12px 18px;cursor:pointer;color:var(--ink)}
  #drop input{display:none}
  #err{font-size:12px;color:#8a3b2a;max-width:520px}
</style>
</head>

   então ao atualizar este arquivo o config.js continua valendo. */

const VISTAS_PADRAO = {
  1:'Boulevard', 2:'Boulevard', 3:'Esq. Boulevard/The One', 4:'Esq. The One/Cassiano', 5:'Cassiano', 6:'Cassiano',
  7:'Cassiano', 8:'Cassiano', 9:'Esq. Cassiano/Rua Acalmada', 10:'Esq. Rua Acalmada/Parque',
  11:'Rua Acalmada', 12:'Esq. Acalmada/Parque', 13:'Esq. Parque/Boulevard', 14:'Boulevard'
};
const CFG = window.MARTIM_CONFIG || {};
const CONFIG = Object.assign({}, CONFIG_PADRAO, CFG);
const VISTAS = Object.assign({}, VISTAS_PADRAO, CFG.vistas || {});
const AREAS_COMUNS_NOMES = Object.assign({7:'Gourmet, Mirador Gourmet e Salas de reunião', 2:'Lounge, Salas Multiuso e Praça Cererê'}, CFG.areasComunsNomes || {});
// fontes do projeto informadas no config.js
(CFG.fontes||[]).forEach(f=>{ const st=document.createElement('style'); st.textContent=`@font-face{font-family:"Articulat CF";src:url("${f.arquivo}");font-weight:${f.peso||400}}`; document.head.appendChild(st); });
const TIPO_CLASS = { '70 a 88 m²':'B', '48 a 63 m²':'C', '39 a 41 m²':'A' };
const TIPO_ORDER = ['70 a 88 m²','48 a 63 m²','39 a 41 m²'];
const TIPO_VAR   = { '70 a 88 m²':'--t7088', '48 a 63 m²':'--t4863', '39 a 41 m²':'--t3941' };

/* ============ LEITURA DA ABA DADOS ============ */
function lerPlanilha(buf){
  let grid;
  if (Array.isArray(buf)) grid = buf;                       // já veio como grade (JSON do Apps Script)
  else {
    const wb = XLSX.read(buf, {type:'array', raw:true});
    const ws = wb.Sheets['DADOS'] || wb.Sheets[wb.SheetNames[0]]; if (!ws) throw new Error('Não encontrei a aba DADOS.');
    grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  }
  // localiza os dois blocos pelo cabeçalho "Andar" + ("Status" | "Tipologia")
  const achar = (col2) => grid.findIndex(r => r && String(r[0]).trim()==='Andar' && String(r[2]).trim()===col2);
  const hs = achar('Status'), ht = achar('Tipologia');
  if (hs<0 || ht<0) throw new Error('Não encontrei os blocos "Status" e "Tipologia" na aba DADOS.');
  const lerBloco = (h) => { const out=[]; for (let r=h+1; r<grid.length; r++){ const row=grid[r]; if(!row || !row[0]) break;
      const andar=parseInt(String(row[0])); const salas=[]; for(let c=1;c<row.length;c+=2){ if(row[c]==null||row[c]===''||isNaN(Number(row[c]))) continue; salas.push({n:row[c], v:row[c+1]}); }
      out.push({andar, salas, obs: row[row.length-1]}); } return out; };
  const st = lerBloco(hs), tp = lerBloco(ht);
  const tipoPorSala = {}; tp.forEach(f => f.salas.forEach(s => tipoPorSala[String(s.n)] = s.v));
  return st.map(f => ({ andar: f.andar, salas: f.salas.map(s => ({ n:String(s.n), status:String(s.v||'').trim().toLowerCase(), tipo: tipoPorSala[String(s.n)] })) }));
}

/* ============ RENDER ============ */
function render(andares, quando){
  const cnt={dis:0,res:0}; const tipoCnt={}; TIPO_ORDER.forEach(t=>tipoCnt[t]={t:0,r:0});
  const el = document.getElementById('floors'); el.innerHTML='';
  const fmtVista = v => v.replace(/^Esq\. /,'Esq.<br>').replace('/',' /<br>');
  const vistaRow = (finais) => `<div></div><div class="units">${finais.map(i=> i==null ? '<div class="v"></div>' : `<div class="v">${fmtVista(VISTAS[i]||'')}</div>`).join('')}</div>`;
  const maxTop = andares[0].salas.length;                       // colunas do andar mais alto
  const maxAll = Math.max(...andares.map(f=>f.salas.length));   // colunas do andar mais largo
  document.getElementById('vistas').innerHTML = vistaRow(Array.from({length:maxTop},(_,i)=>i+1));
  andares.forEach((f,k)=>{
    // quando a torre alarga, coloca a vista das colunas extras logo acima do primeiro andar largo
    if (f.salas.length>maxTop && (k===0 || andares[k-1].salas.length<=maxTop)){
      const sub=document.createElement('div'); sub.className='vistas sub';
      sub.innerHTML = vistaRow(Array.from({length:f.salas.length},(_,i)=> i<maxTop ? null : i+1));
      el.appendChild(sub);
    }
    const row=document.createElement('div'); row.className='floor';
    row.innerHTML=`<div class="fl">${f.andar}º</div>`;
    const units=document.createElement('div'); units.className='units';
    const ac = CONFIG.areasComuns[f.andar];
    const amen = ac ? `<div class="amen" style="width:${ac.span*66+(ac.span-1)*6}px">${amenLabel(f.andar)}</div>` : '';
    const tiles = f.salas.map(s=>{
      const dis = CONFIG.statusDisponivel.includes(s.status); cnt[dis?'dis':'res']++;
      if (tipoCnt[s.tipo]){ tipoCnt[s.tipo].t++; if(!dis) tipoCnt[s.tipo].r++; }
      return `<div class="u ${TIPO_CLASS[s.tipo]||''} ${dis?'dis':'res'}">${s.n}</div>`;
    }).join('');
    units.innerHTML = ac && ac.pos==='antes' ? amen+tiles : tiles+amen;
    row.appendChild(units); el.appendChild(row);
  });
  const total=cnt.dis+cnt.res, pct=total?Math.round(cnt.res/total*100):0;
  document.getElementById('pct').innerHTML=`${pct}%<small>reservado</small>`;
  document.getElementById('bar').innerHTML=`<i style="width:${total?cnt.res/total*100:0}%;background:var(--res)"></i><i style="flex:1;background:var(--livre)"></i>`;
  document.getElementById('rows').innerHTML=
    `<div><span><i class="sw" style="background:var(--res)"></i>Reservadas</span><span>${cnt.res}</span></div>`+
    `<div><span><i class="sw" style="background:var(--livre)"></i>Disponíveis</span><span>${cnt.dis}</span></div>`+
    `<div><span>Total de salas</span><span>${total}</span></div>`;
  document.getElementById('tipos').innerHTML=TIPO_ORDER.map(k=>{ const c=tipoCnt[k]; const p=c.t?Math.round(c.r/c.t*100):0;
    return `<div class="tipo"><b style="background:var(${TIPO_VAR[k]})"></b><div>Salas de ${k}<em>${c.t} salas, ${p}% reservado</em></div><div class="mini"><i style="width:${p}%"></i></div></div>`; }).join('');
  document.getElementById('updated').textContent='Atualizado em '+quando.toLocaleString('pt-BR',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).replace('.','');
  document.getElementById('drop').classList.remove('on');
}
function amenLabel(andar){ return AREAS_COMUNS_NOMES[andar]||'Área condominial'; }

/* ============ CARREGAMENTO ============ */
let assinaturaAnterior = null;
async function carregarDaPasta(){
  try{
    const r = await fetch(CONFIG.arquivo+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const ct = r.headers.get('content-type')||'';
    let dados, quando, assinatura;
    if (ct.includes('json')){
      const j = await r.json();                                // {atualizado, dados:[[...],[...]]}
      dados = j.dados; quando = j.atualizado ? new Date(j.atualizado) : new Date(); assinatura = JSON.stringify(j.dados);
    } else {
      const buf = await r.arrayBuffer();
      const mod = r.headers.get('last-modified'); quando = mod ? new Date(mod) : new Date();
      dados = buf; assinatura = buf.byteLength+'|'+mod;
    }
    if (assinatura!==assinaturaAnterior){ render(lerPlanilha(dados), quando); assinaturaAnterior=assinatura; }
  }catch(e){
    if(!assinaturaAnterior){ document.getElementById('drop').classList.add('on');
      document.getElementById('err').textContent = location.protocol==='file:' ? 'Aberto direto do disco: o navegador não deixa ler a planilha automaticamente. Use um servidor web ou carregue o arquivo aqui.' : 'Não consegui ler '+CONFIG.arquivo+' ('+e.message+').'; }
  }
}
function carregarArquivo(file){ const fr=new FileReader(); fr.onload=()=>{ try{ render(lerPlanilha(fr.result), new Date(file.lastModified)); assinaturaAnterior='manual'; }catch(e){ document.getElementById('err').textContent=e.message; } }; fr.readAsArrayBuffer(file); }
document.getElementById('file').addEventListener('change', e=>{ if(e.target.files[0]) carregarArquivo(e.target.files[0]); });
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) carregarArquivo(f); });

/* ============ ESCALA PARA A TELA ============ */
function ajustar(){ const s=Math.min(innerWidth/1500, innerHeight/1000); document.getElementById('frame').style.transform=`scale(${s})`; }
addEventListener('resize', ajustar); ajustar();
carregarDaPasta(); setInterval(carregarDaPasta, CONFIG.recarregarCadaSeg*1000);
</script>
